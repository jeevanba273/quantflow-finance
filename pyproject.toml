[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantflow-finance"
dynamic = ["version"]
description = "Black-Scholes-Merton, binomial-tree and Monte Carlo option pricing, return-based risk metrics and mean-variance portfolio optimisation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeevan B A", email = "jeevanba273@gmail.com" }]
keywords = [
    "quantitative finance",
    "options pricing",
    "risk management",
    "black-scholes",
    "portfolio analysis",
    "financial engineering",
    "derivatives",
    "VaR",
    "market data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.55"]
# Reference libraries for the optional cross-check tests and benchmarks.
validation = ["QuantLib", "vollib"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "build>=1.0",
    "twine>=4.0",
]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "numpydoc>=1.6",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]

[project.urls]
Homepage = "https://github.com/jeevanba273/quantflow-finance"
Documentation = "https://quantflow-finance.readthedocs.io"
Source = "https://github.com/jeevanba273/quantflow-finance"
Issues = "https://github.com/jeevanba273/quantflow-finance/issues"
Changelog = "https://github.com/jeevanba273/quantflow-finance/blob/main/CHANGELOG.md"
Blog = "https://financefluentblog.com/"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "quantflow_finance.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests", "src/quantflow_finance"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --doctest-modules"
markers = [
    "network: tests that hit the live network (deselected in CI with -m 'not network')",
]

[tool.coverage.run]
branch = true
source = ["quantflow_finance"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs/_build", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
# Line length is enforced by the formatter; long string literals are allowed.
ignore = ["E501"]
