name: CI

on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests, doctests, documented examples and example scripts
        run: pytest -m "not network" --cov=quantflow_finance --cov-report=xml

  test-minimum-versions:
    # The oldest dependency versions allowed by pyproject.toml.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the minimum supported versions
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.23.0" "scipy==1.9.0" "pandas==1.5.0" pytest
          pip install --no-deps -e .
      - name: Run tests
        run: pytest -m "not network"

  reference:
    # Cross-checks against QuantLib and vollib, and a short benchmark run.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with the reference libraries
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,validation]"
      - name: Check the reference libraries import (so no cross-check is skipped)
        run: python -c "import QuantLib, vollib; print(QuantLib.__version__)"
      - name: Run tests, including the cross-checks
        run: pytest -m "not network" -rs
      - name: Benchmark script (quick mode)
        run: python benchmarks/run_benchmarks.py --quick

  docs:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build documentation (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
